<svg viewBox="0 0 1000 1350" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="1350" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">Architecture globale du projet</text>

  <!-- ============ SECTION 1 : Workflow principal ============ -->
  <rect x="30" y="70" width="940" height="560" rx="12" fill="#f0f4ff" stroke="#4361ee" stroke-width="2"/>
  <text x="500" y="100" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Workflow principal — Agent tuteur</text>

  <!-- Reeborg -->
  <rect x="380" y="120" width="240" height="50" rx="8" fill="#4361ee"/>
  <text x="500" y="150" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Reeborg's World (jeu local)</text>

  <line x1="500" y1="170" x2="500" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="195" font-size="11" fill="#555" font-style="italic">widget de chat flottant</text>
  <text x="620" y="208" font-size="11" fill="#555" font-style="italic">(script Tampermonkey)</text>

  <!-- Webhook -->
  <rect x="400" y="210" width="200" height="45" rx="8" fill="#3a0ca3"/>
  <text x="500" y="238" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Webhook (n8n)</text>

  <line x1="500" y1="255" x2="500" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI Agent -->
  <rect x="350" y="290" width="300" height="55" rx="8" fill="#7209b7"/>
  <text x="500" y="315" text-anchor="middle" font-size="14" fill="white" font-weight="bold">AI Agent (orchestrateur)</text>
  <text x="500" y="333" text-anchor="middle" font-size="11" fill="#e0d0f0">LLM : Groq — openai/gpt-oss-120b</text>

  <!-- Tools -->
  <line x1="500" y1="345" x2="500" y2="365" stroke="#333" stroke-width="2"/>

  <rect x="60" y="380" width="180" height="55" rx="8" fill="#f72585"/>
  <text x="150" y="402" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Supabase</text>
  <text x="150" y="418" text-anchor="middle" font-size="11" fill="white">Vector Store (RAG)</text>

  <rect x="260" y="380" width="180" height="55" rx="8" fill="#f72585"/>
  <text x="350" y="398" text-anchor="middle" font-size="12" fill="white" font-weight="bold">HTTP Request</text>
  <text x="350" y="414" text-anchor="middle" font-size="11" fill="white">Wandbox API</text>
  <text x="350" y="428" text-anchor="middle" font-size="10" fill="#ffd6e8">(exécution de code)</text>

  <rect x="460" y="380" width="180" height="55" rx="8" fill="#f72585"/>
  <text x="550" y="402" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Google Sheets</text>
  <text x="550" y="418" text-anchor="middle" font-size="11" fill="white">suivi progression</text>

  <rect x="660" y="380" width="140" height="55" rx="8" fill="#f72585"/>
  <text x="730" y="402" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Gmail</text>
  <text x="730" y="418" text-anchor="middle" font-size="11" fill="white">rapport parent</text>

  <rect x="820" y="380" width="140" height="55" rx="8" fill="#f72585"/>
  <text x="890" y="398" text-anchor="middle" font-size="12" fill="white" font-weight="bold">MCP Client</text>
  <text x="890" y="414" text-anchor="middle" font-size="11" fill="white">Firecrawl</text>
  <text x="890" y="428" text-anchor="middle" font-size="10" fill="#ffd6e8">(scraping ciblé)</text>

  <!-- connecting lines agent -> tools -->
  <line x1="500" y1="365" x2="150" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="365" x2="350" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="365" x2="550" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="365" x2="730" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="365" x2="890" y2="380" stroke="#333" stroke-width="1.5"/>

  <!-- back to agent then to respond -->
  <line x1="500" y1="435" x2="500" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="470" width="340" height="50" rx="8" fill="#3a0ca3"/>
  <text x="500" y="500" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Respond to Webhook</text>

  <line x1="500" y1="520" x2="500" y2="555" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="575" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Réponse affichée dans le widget du jeu</text>

  <!-- ============ SECTION 2 : Workflow secondaire ============ -->
  <rect x="30" y="660" width="940" height="660" rx="12" fill="#fff7ed" stroke="#e07a00" stroke-width="2"/>
  <text x="500" y="695" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Workflow secondaire — Ingestion RAG (documents PDF et sites web)</text>

  <!-- Branch A: PDF -->
  <text x="230" y="730" text-anchor="middle" font-size="13" font-weight="bold" fill="#e07a00">Branche PDF</text>

  <rect x="110" y="745" width="240" height="45" rx="8" fill="#e07a00"/>
  <text x="230" y="772" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Google Drive (dossier PDF)</text>

  <line x1="230" y1="790" x2="230" y2="815" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="815" width="300" height="45" rx="8" fill="#f4a261"/>
  <text x="230" y="842" text-anchor="middle" font-size="11.5" fill="#1a1a2e" font-weight="bold">HTTP Request → Split Out → Loop Over Items</text>

  <line x1="230" y1="860" x2="230" y2="885" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="885" width="240" height="45" rx="8" fill="#f4a261"/>
  <text x="230" y="912" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="bold">Google Drive (Download) → Extraction PDF</text>

  <line x1="230" y1="930" x2="230" y2="955" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="955" width="280" height="55" rx="8" fill="#f4a261"/>
  <text x="230" y="978" text-anchor="middle" font-size="11.5" fill="#1a1a2e" font-weight="bold">Chunking (Default Data Loader)</text>
  <text x="230" y="995" text-anchor="middle" font-size="11" fill="#1a1a2e">Embeddings (Ollama)</text>

  <!-- Branch B: Web -->
  <text x="770" y="730" text-anchor="middle" font-size="13" font-weight="bold" fill="#e07a00">Branche Web</text>

  <rect x="650" y="745" width="240" height="55" rx="8" fill="#e07a00"/>
  <text x="770" y="768" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Crawler Agent</text>
  <text x="770" y="784" text-anchor="middle" font-size="10.5" fill="#ffe8cc">Firecrawl via MCP — Groq</text>

  <line x1="770" y1="800" x2="770" y2="825" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="818" text-anchor="middle" font-size="9.5" fill="#555" font-style="italic"></text>

  <rect x="620" y="825" width="300" height="55" rx="8" fill="#f4a261"/>
  <text x="770" y="847" text-anchor="middle" font-size="11" fill="#1a1a2e" font-weight="bold">Scrape : docs.python.org</text>
  <text x="770" y="862" text-anchor="middle" font-size="10.5" fill="#1a1a2e">realpython.com / w3schools.com</text>

  <line x1="770" y1="880" x2="770" y2="905" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="905" width="260" height="45" rx="8" fill="#f4a261"/>
  <text x="770" y="932" text-anchor="middle" font-size="11.5" fill="#1a1a2e" font-weight="bold">Formatage (Set) → Chunking</text>

  <!-- merge into Supabase -->
  <line x1="230" y1="1010" x2="230" y2="1050" stroke="#333" stroke-width="2"/>
  <line x1="770" y1="950" x2="770" y2="1050" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="1050" x2="770" y2="1050" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="1050" x2="500" y2="1080" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="1080" width="340" height="55" rx="8" fill="#f72585"/>
  <text x="500" y="1103" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Supabase Vector Store</text>
  <text x="500" y="1120" text-anchor="middle" font-size="11" fill="#ffd6e8">(insertion des embeddings)</text>

  <text x="500" y="1160" text-anchor="middle" font-size="12" fill="#333" font-style="italic">Base de connaissance RAG partagée, interrogée par l'AI Agent du workflow principal</text>

  <!-- Legend -->
  <rect x="60" y="1200" width="18" height="18" fill="#4361ee"/>
  <text x="86" y="1214" font-size="12" fill="#333">Point d'entrée / n8n core</text>

  <rect x="300" y="1200" width="18" height="18" fill="#7209b7"/>
  <text x="326" y="1214" font-size="12" fill="#333">AI Agent</text>

  <rect x="440" y="1200" width="18" height="18" fill="#f72585"/>
  <text x="466" y="1214" font-size="12" fill="#333">Tool connecté à l'agent</text>

  <rect x="660" y="1200" width="18" height="18" fill="#f4a261"/>
  <text x="686" y="1214" font-size="12" fill="#333">Étape d'ingestion</text>
</svg>
